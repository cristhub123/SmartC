[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/js/*"
  [headers.values]
    # [2026-08-29 — PLAN_OPTIMIZACION_PERFORMANCE_2026-08-29.md, sección 3]
    # Antes: no-cache obligaba a revalidar los ~780 KB de JS propio en
    # CADA visita. Ahora que index.html versiona cada <script src="js/...">
    # con "?v=", un cache largo es seguro: un cambio de código = URL
    # distinta = no sirve el JS viejo desde caché.
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"



